version: '3.8'

services:
  mqtt-broker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python broker/mqtt_broker.py
    environment:
      - MQTT_BIND_HOST=0.0.0.0
      - MQTT_PORT=1883
      - MQTT_WS_PORT=9001
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      - MQTT_WS_PORT=9001
      - ALLOWED_ORIGINS=*
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/pxt_iot.db
    ports:
      - "8000:8000"
    volumes:
      - ./pxt_iot.db:/app/pxt_iot.db
    depends_on:
      - mqtt-broker
    restart: always

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python simulator/simulator_manager.py
    environment:
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
    depends_on:
      - mqtt-broker
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - backend
    restart: always
