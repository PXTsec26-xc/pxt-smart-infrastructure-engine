version: '3.8'

services:
  mqtt-broker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python broker/mqtt_broker.py
    ports:
      - "1883:1883"
      - "9001:9001"
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./pxt_iot.db:/app/pxt_iot.db
    depends_on:
      - mqtt-broker
    restart: always

  simulator:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: python simulator/simulator_manager.py
    depends_on:
      - mqtt-broker
      - backend
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always
